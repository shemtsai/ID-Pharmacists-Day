<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Type of ID Pharmacist Are You?</title>
    <style>
        /* CSS Custom Properties for our Clinical/Playful Theme */
        :root {
            --primary-blue: #0B3C5D;
            --secondary-blue: #328CC1;
            --teal-accent: #008080;
            --teal-hover: #006666;
            --crimson-alert: #D9534F;
            --sterile-white: #FFFFFF;
            --bg-color: #F4F7F6;
            --text-main: #333333;
            --text-light: #666666;
            --border-color: #E0E0E0;
        }

        /* Global Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        /* App Container Layout */
        .app-container {
            background: var(--sterile-white);
            max-width: 650px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(11, 60, 93, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* Header & Progress Bar */
        header {
            background: var(--primary-blue);
            color: var(--sterile-white);
            padding: 24px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            height: 8px;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--teal-accent);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Content Area */
        .content {
            padding: 30px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        /* Question Styles */
        .question-number {
            color: var(--secondary-blue);
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .question-text {
            font-size: 1.3rem;
            color: var(--primary-blue);
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Options/Buttons */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--sterile-white);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            border-color: var(--secondary-blue);
            background: #F9FCFF;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(50, 140, 193, 0.1);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        /* Result View Styles */
        .result-view {
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-title {
            font-size: 1.8rem;
            color: var(--primary-blue);
            margin-bottom: 15px;
        }

        .result-desc {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .restart-btn {
            background: var(--teal-accent);
            color: var(--sterile-white);
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 128, 128, 0.3);
        }

        .restart-btn:hover {
            background: var(--teal-hover);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Utility classes for state switching */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>What Type of ID Pharmacist Are You?</h1>
            <div id="progress-container" class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </header>

        <main class="content">
            <!-- Question View -->
            <div id="question-view">
                <span id="question-number" class="question-number">Question 1 of 9</span>
                <h2 id="question-text" class="question-text">Question goes here</h2>
                <div id="options-container" class="options-grid">
                    <!-- Option buttons will be injected here via JavaScript -->
                </div>
            </div>

            <!-- Result View -->
            <div id="result-view" class="result-view hidden">
                <div id="result-icon" class="result-icon">🦠</div>
                <h2 id="result-title" class="result-title">Your Profile</h2>
                <p id="result-desc" class="result-desc">Profile description goes here.</p>
                <button id="restart-btn" class="restart-btn">Play Again</button>
            </div>
        </main>
    </div>

    <script>
        /** 
         * Application Data
         * 12 distinct ID Pharmacy profiles, as requested.
         */
        const profiles = {
            stewardship: {
                title: "The Stewardship Warden",
                icon: "🛡️",
                desc: "Strict on the formulary, you live for restrictive criteria. You can spot an inappropriate daptomycin order from a mile away, and you single-handedly fight the linezolid pipeline to protect it for when it's truly needed."
            },
            pkpd: {
                title: "The PK/PD Wizard",
                icon: "🧮",
                desc: "Deep in the math. You calculate continuous infusion beta-lactams in your sleep. You see the world entirely in troughs, clearance equations, and AUC/MIC ratios."
            },
            culture: {
                title: "The Culture Whisperer",
                icon: "🧫",
                desc: "You hang out in the micro lab. You decipher ambiguous Gram stains like ancient runes and know exactly what a 'Gram-variable rod' actually means hours before the PCR runs."
            },
            opat: {
                title: "The Outpatient Outlaw (OPAT Champion)",
                icon: "🏡",
                desc: "The logistics mastermind. You coordinate PICC lines, lab monitoring, home health, and insurance approvals with surgical precision to get patients out of the hospital safely."
            },
            academic: {
                title: "The Academic Academic (The Mentor)",
                icon: "📚",
                desc: "You live for the data. Keeping a stack of primary literature handy to disprove a resident's choice of therapy, your natural habitat is teaching rounds, dropping knowledge bombs on trainees."
            },
            icu: {
                title: "The ICU Nomad (Critical Care Cross-over)",
                icon: "⚡",
                desc: "You thrive in chaos. Splitting time between ID and the intensive care unit, you deal with crashing septic shock, salvage therapies, and the absolute limits of dosing guidelines."
            },
            rapid: {
                title: "The Rapid Diagnostic Speedrunner",
                icon: "⏱️",
                desc: "Obsessed with the molecular panel. The second the rapid blood culture identification flag hits the chart, you've already paged the provider, changed the order, and saved 12 hours of broad-spectrum exposure."
            },
            hiv: {
                title: "The HIV / PrEP Navigator",
                icon: "🤝",
                desc: "The master of long-term care and outpatient counseling. You know every single drug-drug interaction with ART by heart, treat adherence barriers with immense empathy, and handle prior authorizations like a seasoned pro."
            },
            transplant: {
                title: "The Transplant / Immunocompromised Titan",
                icon: "⚖️",
                desc: "You deal with the highest stakes. You beautifully balance CMV viral loads, deep fungal infections, and complex drug levels in solid organ or bone marrow transplant recipients where everything is a tightrope walk."
            },
            peds: {
                title: "The Peds Dosing Picasso",
                icon: "🧸",
                desc: "The champion of mg/kg and liquid formulations. You seamlessly convert massive adult regimens into palatable, weight-adjusted doses for neonates, silently judging clinicians who think a 1-gram flat dose solves everything."
            },
            ip: {
                title: "The Infection Prevention Overlord",
                icon: "🧼",
                desc: "The macro-thinker. Obsessed with hand hygiene audits, sterile processing, outbreaks, and tracking HAIs. You don't just care about the patient; you care about the entire building's biome."
            },
            industry: {
                title: "The Industry / Public Health Maverick",
                icon: "🌍",
                desc: "The non-traditional trail-blazer. Whether writing national guidelines, running clinical trials, or tracking regional resistance patterns at the CDC level, you look at ID through a wide-angle lens."
            }
        };

        /**
         * Quiz Questions & Scoring Logic
         * Each answer allocates points to specific personality profiles.
         */
        const questions = [
            {
                text: "It’s 15:53 on a Friday and a 'rule out cellulitis' gets ordered for daptomycin. What's your move?",
                options: [
                    { text: "Reject immediately and suggest cefazolin. Protect the pipeline!", scores: { stewardship: 3, ip: 1 } },
                    { text: "Call to arrange home infusion so they can leave today.", scores: { opat: 3 } },
                    { text: "Check renal function and weight to ensure mg/kg dosing is flawless if it IS used.", scores: { pkpd: 3, peds: 2 } },
                    { text: "Look up the local antibiogram for MRSA rates before deciding.", scores: { industry: 3, academic: 2 } }
                ]
            },
            {
                text: "A rapid molecular panel flags positive for a complex resistance gene (like NDM or KPC). How do you react?",
                options: [
                    { text: "Page the team immediately to switch to a targeted novel beta-lactamase inhibitor combo.", scores: { rapid: 3, icu: 2 } },
                    { text: "Go down to the micro lab to look at the actual plate and confirm the morphology.", scores: { culture: 3 } },
                    { text: "Immediately trigger contact isolation protocols and trace the patient's room history.", scores: { ip: 3 } },
                    { text: "Start drafting a case report and pull the primary literature for grand rounds.", scores: { academic: 3 } }
                ]
            },
            {
                text: "A provider asks you, 'Can we just use double-dose Bactrim for this?'",
                options: [
                    { text: "'Only if you want massive hyperkalemia and a creatinine spike. Let me calculate the clearance.'", scores: { pkpd: 3, icu: 1 } },
                    { text: "'Is it for PCP prophylaxis? Let's check their CD4 count and ART interactions first.'", scores: { hiv: 3, transplant: 2 } },
                    { text: "'No, but let's look at the liquid formulation options if swallowing is an issue.'", scores: { peds: 3 } },
                    { text: "'Absolutely not. It's restricted unless it's a verified, approved indication.'", scores: { stewardship: 3 } }
                ]
            },
            {
                text: "What is your reaction to a team wanting to start 'tailored therapy' when source control hasn't been established?",
                options: [
                    { text: "'Source control is the ONLY thing that matters. Wash your hands and call surgery!'", scores: { ip: 2, icu: 3 } },
                    { text: "'I will personally hold the antimicrobial orders hostage until the abscess is drained.'", scores: { stewardship: 3 } },
                    { text: "'Let's get the rapid diagnostics off the blood cultures while we wait for the OR.'", scores: { rapid: 3 } },
                    { text: "'The AUC/MIC target is impossible to reach in an undrained collection anyway.'", scores: { pkpd: 3, academic: 1 } }
                ]
            },
            {
                text: "You see someone walk out of a contact isolation room without washing their hands or using gel.",
                options: [
                    { text: "Physically block their path until they sanitize, citing the WHO's 5 moments.", scores: { ip: 3 } },
                    { text: "Sigh and prepare to see a hospital-acquired infection on your tracking dashboard next week.", scores: { industry: 3 } },
                    { text: "Remind them that C. diff spores require soap and water, dropping a stat about incidence rates.", scores: { academic: 3, culture: 1 } },
                    { text: "Ignore it because you're busy running to a code in the medical ICU.", scores: { icu: 3 } }
                ]
            },
            {
                text: "You are looking at a vancomycin trough that was drawn 4 hours early.",
                options: [
                    { text: "Extrapolate the true trough using first-order pharmacokinetic equations.", scores: { pkpd: 3 } },
                    { text: "Refuse to act on it and order a new level. Discard the tainted data!", scores: { stewardship: 2, academic: 2 } },
                    { text: "Adjust the timing to fit the patient's dialysis or ECMO schedule.", scores: { icu: 2, transplant: 3 } },
                    { text: "Check if they can just transition to dalbavancin and go home instead.", scores: { opat: 3 } }
                ]
            },
            {
                text: "What is your absolute favorite piece of literature or data to cite?",
                options: [
                    { text: "The most recent IDSA guidelines, which I have committed to memory.", scores: { academic: 3, stewardship: 1 } },
                    { text: "Real-time epidemiological data and resistance patterns from the CDC.", scores: { industry: 3, ip: 2 } },
                    { text: "A niche paper on complex drug-drug interactions with tacrolimus or bictegravir.", scores: { transplant: 3, hiv: 3 } },
                    { text: "A retrospective chart review on optimizing turn-around times for blood cultures.", scores: { rapid: 3, culture: 2 } }
                ]
            },
            {
                text: "A patient is admitted with a mysterious, undifferentiated fever. Where does your mind go?",
                options: [
                    { text: "Dive deep into their sexual history, travel history, and immune status.", scores: { hiv: 3, transplant: 2 } },
                    { text: "Wait patiently for the blood cultures and PCR panels to do their magic.", scores: { culture: 3, rapid: 2 } },
                    { text: "Ensure they aren't on 5 different broad-spectrum agents without a stop date.", scores: { stewardship: 3 } },
                    { text: "Look closely at the weight-based dosing for their empiric coverage just in case.", scores: { peds: 3, icu: 1 } }
                ]
            },
            {
                text: "Finally, what is your ultimate career goal in Pharmacy?",
                options: [
                    { text: "Running an entire health system's stewardship and infection control program.", scores: { ip: 2, stewardship: 2, industry: 2 } },
                    { text: "Being the absolute go-to expert for the most critically ill and complex cases.", scores: { icu: 3, transplant: 2, hiv: 1 } },
                    { text: "Publishing practice-changing research and mentoring the next generation.", scores: { academic: 3, pkpd: 2 } },
                    { text: "Making patient transitions seamless and preventing unnecessary hospital days.", scores: { opat: 3, peds: 2, rapid: 1 } }
                ]
            }
        ];

        /**
         * State Variables
         */
        let currentQuestionIndex = 0;
        let scoreTracker = {};

        /**
         * DOM Elements
         */
        const questionView = document.getElementById('question-view');
        const resultView = document.getElementById('result-view');
        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const restartBtn = document.getElementById('restart-btn');

        /**
         * Initialization & Reset Function
         */
        function initQuiz() {
            currentQuestionIndex = 0;
            
            // Reset score tracker based on profile keys
            scoreTracker = {};
            for (let key in profiles) {
                scoreTracker[key] = 0;
            }

            // UI Reset
            resultView.classList.add('hidden');
            questionView.classList.remove('hidden');
            progressContainer.classList.remove('hidden');
            
            renderQuestion();
        }

        /**
         * Render Current Question and Options
         */
        function renderQuestion() {
            // Add slight fade-in effect when rendering a new question
            questionView.style.animation = 'none';
            questionView.offsetHeight; /* trigger reflow */
            questionView.style.animation = 'fadeIn 0.4s ease';

            const currentQ = questions[currentQuestionIndex];
            
            // Update Text & Progress
            questionNumberEl.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            questionTextEl.textContent = currentQ.text;
            progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;

            // Clear previous options
            optionsContainer.innerHTML = '';

            // Render new option buttons
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.onclick = () => handleAnswer(option.scores);
                optionsContainer.appendChild(btn);
            });
        }

        /**
         * Handle user selection, update scores, advance quiz
         */
        function handleAnswer(scores) {
            // Apply points to respective profiles
            for (let profileKey in scores) {
                if (scoreTracker[profileKey] !== undefined) {
                    scoreTracker[profileKey] += scores[profileKey];
                }
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        /**
         * Calculate highest score and render Result View
         */
        function showResults() {
            progressBar.style.width = '100%';
            
            // Delay slightly for visual finish of progress bar
            setTimeout(() => {
                questionView.classList.add('hidden');
                progressContainer.classList.add('hidden');
                resultView.classList.remove('hidden');

                // Determine the highest scoring profile
                let maxScore = -1;
                let winningProfileKey = '';

                for (let key in scoreTracker) {
                    if (scoreTracker[key] > maxScore) {
                        maxScore = scoreTracker[key];
                        winningProfileKey = key;
                    }
                }

                // Populate results UI
                const winner = profiles[winningProfileKey];
                resultIcon.textContent = winner.icon;
                resultTitle.textContent = winner.title;
                resultDesc.textContent = winner.desc;
            }, 300);
        }

        // Event Listeners
        restartBtn.addEventListener('click', initQuiz);

        // Start Quiz on load
        initQuiz();

    </script>
</body>
</html>
